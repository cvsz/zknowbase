services:
  backend:
    environment:
      ZKB_METRICS_ENABLED: ${ZKB_METRICS_ENABLED:-true}
      ZKB_OTEL_SERVICE_NAME: ${ZKB_OTEL_SERVICE_NAME:-zknowbase}
      ZKB_OTEL_EXPORTER_OTLP_ENDPOINT: ${ZKB_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      ZKB_OTEL_EXPORT_TIMEOUT_SECONDS: ${ZKB_OTEL_EXPORT_TIMEOUT_SECONDS:-5}

  worker:
    environment:
      ZKB_OTEL_SERVICE_NAME: ${ZKB_OTEL_SERVICE_NAME:-zknowbase-worker}
      ZKB_OTEL_EXPORTER_OTLP_ENDPOINT: ${ZKB_OTEL_EXPORTER_OTLP_ENDPOINT:-http://otel-collector:4318}
      ZKB_OTEL_EXPORT_TIMEOUT_SECONDS: ${ZKB_OTEL_EXPORT_TIMEOUT_SECONDS:-5}

  otel-collector:
    image: otel/opentelemetry-collector:0.132.0
    profiles: ["observability"]
    restart: unless-stopped
    command: ["--config=/etc/otelcol/config.yaml"]
    volumes:
      - ./ops/observability/otel-collector.yaml:/etc/otelcol/config.yaml:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - backend
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=15d
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    restart: unless-stopped
    depends_on:
      - prometheus
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_SECURITY_ADMIN_USER: ${ZKB_GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${ZKB_GRAFANA_ADMIN_PASSWORD:?Set ZKB_GRAFANA_ADMIN_PASSWORD for observability profile}
    volumes:
      - ./ops/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./ops/observability/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "3001:3000"

volumes:
  prometheus_data:
  grafana_data:
