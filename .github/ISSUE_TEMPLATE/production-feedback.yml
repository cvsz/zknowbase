name: Production feedback
description: Report a sanitized production observation for the v0.2.0 feedback cycle
title: "[feedback] "
labels:
  - production-feedback
body:
  - type: markdown
    attributes:
      value: |
        Do not include secrets, credentials, raw document contents, personal data, or tenant names.
        For suspected security issues, follow SECURITY.md and use the private security channel.
  - type: input
    id: version
    attributes:
      label: zknowbase version and commit
      description: Include the exact release/commit and deployment profile.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Initial severity
      options:
        - P0 - active exposure, data loss, or broad outage
        - P1 - material reliability, integrity, DR, upgrade, or contract failure
        - P2 - bounded degradation with workaround
        - P3 - low-risk improvement or documentation
    validations:
      required: true
  - type: dropdown
    id: impact
    attributes:
      label: Impact class
      options:
        - availability
        - integrity or data loss
        - security or privacy
        - tenant isolation
        - performance or cost
        - upgrade or compatibility
        - admin operations
        - other
    validations:
      required: true
  - type: textarea
    id: observation
    attributes:
      label: Sanitized observation
      description: Expected behavior, observed behavior, frequency, and a safe reproduction.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Request ID, UTC timestamps, metric names, and links to sanitized reports. Never include tokens or raw content.
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety confirmation
      options:
        - label: I removed secrets, credentials, personal data, tenant names, and raw document contents.
          required: true
        - label: I checked SECURITY.md for security-sensitive reporting.
          required: true
