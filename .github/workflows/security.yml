name: Security

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  python-dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install pinned pip-audit
        run: python -m pip install --disable-pip-version-check pip-audit==2.10.1
      - name: Audit production Python dependencies
        run: python -m pip_audit -r backend/requirements.txt

  frontend-dependencies:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Resolve exact declared dependency set without lifecycle scripts
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Reject high or critical production dependency vulnerabilities
        run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Install checksum-verified Gitleaks v8.30.1
        shell: bash
        run: |
          set -euo pipefail
          archive=/tmp/gitleaks.tar.gz
          curl --fail --silent --show-error --location \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$archive"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" | sha256sum --check --strict
          tar -xzf "$archive" -C /tmp gitleaks
          /tmp/gitleaks version
      - name: Scan Git history for committed secrets
        run: /tmp/gitleaks git --redact --no-banner --exit-code 1 .

  dependency-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
