name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: zknowbase
          POSTGRES_USER: zknowbase
          POSTGRES_PASSWORD: zknowbase
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U zknowbase -d zknowbase"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      ZKB_TEST_POSTGRES_URL: postgresql://zknowbase:zknowbase@127.0.0.1:5432/zknowbase
      ZKB_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m ruff check app tests
      - run: python -m pytest -q

  performance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      qdrant:
        image: qdrant/qdrant:v1.15.1
        ports:
          - 6333:6333
        options: >-
          --health-cmd "bash -c '</dev/tcp/127.0.0.1/6333'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      PYTHONPATH: .
      ZKB_TEST_QDRANT_URL: http://127.0.0.1:6333
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: python -m pip install -r requirements.txt
      - name: Run bounded Qdrant load benchmark
        run: >-
          python scripts/benchmark_qdrant.py
          --points 512
          --requests 200
          --concurrency 8
          --vector-size 32
          --max-p95-seconds 2.0
          --output performance-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: qdrant-performance-${{ github.sha }}
          path: backend/performance-report.json
          if-no-files-found: error
          retention-days: 30

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - run: npm install --no-audit --no-fund
      - run: npm run test:auth
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      ZKB_API_KEY: ci-only-bootstrap-secret-not-for-production
      ZKB_FRONTEND_API_KEY: ci-only-frontend-secret-not-for-production
      ZKB_ADMIN_USERS_JSON: ci-only-local-users-placeholder
      ZKB_ADMIN_SESSION_SECRET: ci-only-session-secret-0123456789abcdef0123456789abcdef
      ZKB_GRAFANA_ADMIN_PASSWORD: ci-only-grafana-secret-not-for-production
    steps:
      - uses: actions/checkout@v7
      - run: docker compose config --quiet
      - run: docker compose --profile ha config --quiet
      - run: docker compose --profile security config --quiet
      - run: docker compose --profile observability config --quiet
      - run: docker compose --profile ops config --quiet
      - run: docker compose --profile ha --profile security config --quiet
      - run: docker compose --profile ha --profile security --profile observability --profile ops config --quiet
