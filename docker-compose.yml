services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.11.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text && ollama pull qwen2.5:3b"]
    restart: "no"

  # Optional local HA metadata profile. SQLite remains the zero-cost default.
  postgres:
    image: postgres:17-alpine
    profiles: ["ha"]
    restart: unless-stopped
    environment:
      POSTGRES_DB: zknowbase
      POSTGRES_USER: zknowbase
      POSTGRES_PASSWORD: ${ZKB_POSTGRES_PASSWORD:-zknowbase-local-only}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zknowbase -d zknowbase"]
      interval: 5s
      timeout: 5s
      retries: 20

  # Optional self-hosted antivirus. Enable with:
  #   ZKB_MALWARE_SCAN_MODE=clamav docker compose --profile security up --build
  clamav:
    image: clamav/clamav:stable
    profiles: ["security"]
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      test: ["CMD", "clamdscan", "--ping", "1"]
      interval: 15s
      timeout: 10s
      retries: 20
      start_period: 60s

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      ZKB_ENVIRONMENT: production
      ZKB_API_KEY: ${ZKB_API_KEY:?Set ZKB_API_KEY in .env}
      ZKB_BOOTSTRAP_API_KEY_ENABLED: ${ZKB_BOOTSTRAP_API_KEY_ENABLED:-true}
      ZKB_FRONTEND_ORIGIN: http://localhost:3000
      ZKB_QDRANT_URL: http://qdrant:6333
      ZKB_METADATA_BACKEND: ${ZKB_METADATA_BACKEND:-sqlite}
      ZKB_METADATA_DB: /data/zknowbase.db
      ZKB_POSTGRES_URL: ${ZKB_POSTGRES_URL:-}
      ZKB_POSTGRES_POOL_MIN_SIZE: ${ZKB_POSTGRES_POOL_MIN_SIZE:-1}
      ZKB_POSTGRES_POOL_MAX_SIZE: ${ZKB_POSTGRES_POOL_MAX_SIZE:-10}
      ZKB_UPLOAD_DIR: /data/uploads
      ZKB_MALWARE_SCAN_MODE: ${ZKB_MALWARE_SCAN_MODE:-validate}
      ZKB_CLAMAV_HOST: ${ZKB_CLAMAV_HOST:-clamav}
      ZKB_CLAMAV_PORT: ${ZKB_CLAMAV_PORT:-3310}
      ZKB_CLAMAV_TIMEOUT_SECONDS: ${ZKB_CLAMAV_TIMEOUT_SECONDS:-30}
      ZKB_EMBEDDING_PROVIDER: ${ZKB_EMBEDDING_PROVIDER:-ollama}
      ZKB_EMBEDDING_MODEL: ${ZKB_EMBEDDING_MODEL:-nomic-embed-text}
      ZKB_LLM_PROVIDER: ${ZKB_LLM_PROVIDER:-ollama}
      ZKB_LLM_MODEL: ${ZKB_LLM_MODEL:-qwen2.5:3b}
      ZKB_OLLAMA_BASE_URL: http://ollama:11434
      ZKB_OPENAI_BASE_URL: ${ZKB_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"

  worker:
    build: ./backend
    command: ["python", "-m", "app.worker"]
    restart: unless-stopped
    healthcheck:
      disable: true
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      ZKB_ENVIRONMENT: production
      ZKB_BOOTSTRAP_API_KEY_ENABLED: "false"
      ZKB_QDRANT_URL: http://qdrant:6333
      ZKB_METADATA_BACKEND: ${ZKB_METADATA_BACKEND:-sqlite}
      ZKB_METADATA_DB: /data/zknowbase.db
      ZKB_POSTGRES_URL: ${ZKB_POSTGRES_URL:-}
      ZKB_POSTGRES_POOL_MIN_SIZE: ${ZKB_POSTGRES_POOL_MIN_SIZE:-1}
      ZKB_POSTGRES_POOL_MAX_SIZE: ${ZKB_POSTGRES_POOL_MAX_SIZE:-10}
      ZKB_UPLOAD_DIR: /data/uploads
      ZKB_MALWARE_SCAN_MODE: ${ZKB_MALWARE_SCAN_MODE:-validate}
      ZKB_CLAMAV_HOST: ${ZKB_CLAMAV_HOST:-clamav}
      ZKB_CLAMAV_PORT: ${ZKB_CLAMAV_PORT:-3310}
      ZKB_CLAMAV_TIMEOUT_SECONDS: ${ZKB_CLAMAV_TIMEOUT_SECONDS:-30}
      ZKB_EMBEDDING_PROVIDER: ${ZKB_EMBEDDING_PROVIDER:-ollama}
      ZKB_EMBEDDING_MODEL: ${ZKB_EMBEDDING_MODEL:-nomic-embed-text}
      ZKB_OLLAMA_BASE_URL: http://ollama:11434
      ZKB_OPENAI_BASE_URL: ${ZKB_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      ZKB_WORKER_POLL_SECONDS: ${ZKB_WORKER_POLL_SECONDS:-1.0}
      ZKB_WORKER_LEASE_SECONDS: ${ZKB_WORKER_LEASE_SECONDS:-300}
      ZKB_INGESTION_JOB_MAX_ATTEMPTS: ${ZKB_INGESTION_JOB_MAX_ATTEMPTS:-3}
    volumes:
      - backend_data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ZKB_BACKEND_URL: http://backend:8000
      ZKB_API_KEY: ${ZKB_FRONTEND_API_KEY:?Set ZKB_FRONTEND_API_KEY in .env}
    ports:
      - "3000:3000"

volumes:
  qdrant_data:
  ollama_data:
  backend_data:
  postgres_data:
  clamav_data:
