services:
  qdrant:
    image: qdrant/qdrant:v1.15.1
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/6333'"]
      interval: 10s
      timeout: 5s
      retries: 10

  ollama:
    image: ollama/ollama:0.11.4
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 20

  ollama-init:
    image: ollama/ollama:0.11.4
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command: ["ollama pull nomic-embed-text && ollama pull qwen2.5:3b"]
    restart: "no"

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      qdrant:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      ZKB_ENVIRONMENT: production
      ZKB_API_KEY: ${ZKB_API_KEY:?Set ZKB_API_KEY in .env}
      ZKB_FRONTEND_ORIGIN: http://localhost:3000
      ZKB_QDRANT_URL: http://qdrant:6333
      ZKB_METADATA_DB: /data/zknowbase.db
      ZKB_UPLOAD_DIR: /data/uploads
      ZKB_EMBEDDING_PROVIDER: ${ZKB_EMBEDDING_PROVIDER:-ollama}
      ZKB_EMBEDDING_MODEL: ${ZKB_EMBEDDING_MODEL:-nomic-embed-text}
      ZKB_LLM_PROVIDER: ${ZKB_LLM_PROVIDER:-ollama}
      ZKB_LLM_MODEL: ${ZKB_LLM_MODEL:-qwen2.5:3b}
      ZKB_OLLAMA_BASE_URL: http://ollama:11434
      ZKB_OPENAI_BASE_URL: ${ZKB_OPENAI_BASE_URL:-https://api.openai.com/v1}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    volumes:
      - backend_data:/data
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      ZKB_BACKEND_URL: http://backend:8000
      ZKB_API_KEY: ${ZKB_API_KEY:?Set ZKB_API_KEY in .env}
    ports:
      - "3000:3000"

volumes:
  qdrant_data:
  ollama_data:
  backend_data:
